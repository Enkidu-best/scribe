# Облачная проверка (приватный или публичный репозиторий без своего ci.yml) - шаблон общего блока «_общие модули/ci» (правило «GitHub 01», стандарт 6.8).
# Только Linux, одна задача: ruff, юнит-тесты без моделей, check_repo - та же команда, что перед push на Mac
# (scripts/check_all.sh). macOS не нужен - полные проверки идут локально; Windows - только вручную (windows.yml).
# Не править в проекте: правка - в шаблоне, затем sync_common.sh ci <проект> и common/ci/install.sh --workflow.
name: linux

on:
  push:
    branches: [main, master]        # master - Anonymizer
    tags: ["v*"]
    paths-ignore: ["docs/**", "*.md", "*.docx"]
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Пакеты системы (scripts/ci-apt.txt, если есть)
        if: hashFiles('scripts/ci-apt.txt') != ''
        run: sudo apt-get update -qq && xargs -a scripts/ci-apt.txt sudo apt-get install -y -qq --no-install-recommends
      - name: Зависимости без моделей (requirements-ci.txt)
        run: python -m pip install -q -r requirements-ci.txt
      - name: ruff, юнит-тесты, check_repo
        run: bash scripts/check_all.sh
